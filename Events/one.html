<script>

    //type, timestamp, defaultPrevented,

    document.getElementById("Sunset").addEventListener("click", function (e){
        console.log("clicked inside the ur");

      document.getElementById("Sunset").addEventListener("click", function (e) {

            e.stopPropagation()   
            //  if you want ki bubbling na ho inner element jahas hai wahi rha jaye aur outer elemnt jaha hai wahi rha jaye

        }, false)

      
    // Event propogation***********************

    });

    document.getElementById('google').addEventListener('click',function(e){
        e.defaultPrevented();
        e.stopPropagation

    }, false)


    

    document.querySelector('#images').addEventListener('click',function(e){

            let removeIt= e.target.parentNode
            removeIt.remove()
            
        }
